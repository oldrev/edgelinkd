{{- /* Usage: {{ partial "icon.html" "name" }} — markup lives in data/icons.yaml */ -}}
{{- $name := . -}}
<svg class="icon icon-{{ $name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ index site.Data.icons $name | safeHTML }}</svg>
{{- /* trim */ -}}
